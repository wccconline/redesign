name: Deploy Vite site to GitHub Pages

on:
  push:
    branches: [ master ]  # 👈 Change if your default branch is 'master'
  workflow_dispatch:  # lets you redeploy from the Actions tab or `gh workflow run deploy.yml`

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FORMSPREE_ID: ${{ secrets.VITE_FORMSPREE_ID }}
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      # This is the test site: ask search engines not to index it (the live site is deployed by deploy-live.yml)
      VITE_NOINDEX: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
